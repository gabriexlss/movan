name: PR Agent

on:
    pull_request:
        types:
            - opened
            - reopened
            - ready_for_review
            - synchronize

    issue_comment:
        types: [created]
jobs:
    pr_agent:
        if: ${{ github.event.sender.type != 'Bot' }}
        runs-on: ubuntu-latest

        permissions:
            issues: write
            pull-requests: write
            contents: read

        steps:
            - name: PR Agent
              uses: the-pr-agent/pr-agent@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

                  config.model: ${{ vars.PR_AGENT_MODEL }}
                  config.fallback_models: ${{ vars.PR_AGENT_FALLBACK_MODELS }}

                  # Usa inferência Flex do Gemini
                  litellm.extra_body: '{"service_tier":"flex"}'

                  # Flex pode ficar alguns minutos na fila
                  config.ai_timeout: "900"

                  github_action_config.auto_review: "true"
                  github_action_config.auto_describe: "false"
                  github_action_config.auto_improve: "true"