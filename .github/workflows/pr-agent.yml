name: PR Agent

on:
    pull_request:
        types:
            - opened
            - reopened
            - ready_for_review
            - synchronize

    issue_comment:

jobs:
    pr_agent:
        if: ${{ github.event.sender.type != 'Bot' }}
        runs-on: ubuntu-latest

        permissions:
            issues: write
            pull-requests: write
            contents: read

        steps:
            - name: Configurar Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # Executa o runner oficial sem baixar a imagem do Docker Hub.
            - name: Instalar PR Agent
              run: python -m pip install --disable-pip-version-check "pr-agent @ git+https://github.com/The-PR-Agent/pr-agent.git@v0.47.0"

            - name: PR Agent
              run: python -m pr_agent.servers.github_action_runner
              env:
                  LITELLM_LOCAL_MODEL_COST_MAP: "True"
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

                  config.model: "gemini/gemini-3.8-flash"
                  config.fallback_models: '[]'
                  config.max_model_tokens: "1048576"
                  config.max_output_tokens: "65536"
                  config.reasoning_effort: "high"
                  config.additional_reasoning_effort_models: '["gemini/gemini-3.8-flash"]'
                  config.temperature: "1.0"

                  # Usa inferência Flex do Gemini
                  litellm.extra_body: '{"service_tier":"flex"}'

                  # Flex pode ficar alguns minutos na fila
                  config.ai_timeout: "1800"

                  github_action_config.auto_review: "true"
                  github_action_config.auto_describe: "true"
                  github_action_config.auto_improve: "true"
                  github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
