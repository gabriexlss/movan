name: PR Agent

on:
    pull_request:
        types:
            - opened
            - reopened
            - ready_for_review
            - synchronize

    issue_comment:

jobs:
    pr_agent:
        if: ${{ github.event.sender.type != 'Bot' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60

        concurrency:
            group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
            cancel-in-progress: true

        permissions:
            issues: write
            pull-requests: write
            contents: read

        steps:
            - name: Configurar Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # Executa o runner oficial sem baixar a imagem do Docker Hub.
            - name: Instalar PR Agent
              run: python -m pip install --disable-pip-version-check "pr-agent @ git+https://github.com/The-PR-Agent/pr-agent.git@v0.47.0"

            - name: PR Agent
              # A versão fixada tenta novamente sem esperar; adiciona backoff
              # por chamada para não repetir ferramentas que já tiveram sucesso.
              run: |
                  python - <<'PY'
                  from tenacity import stop_after_attempt, wait_exponential, wait_random
                  from pr_agent.algo.ai_handlers.litellm_ai_handler import LiteLLMAIHandler
                  from pr_agent.servers.github_action_runner import main

                  LiteLLMAIHandler._chat_completion_with_retry = (
                      LiteLLMAIHandler._chat_completion_with_retry.retry_with(
                          stop=stop_after_attempt(3),
                          wait=wait_exponential(multiplier=15, max=60) + wait_random(0, 5),
                      )
                  )
                  main()
                  PY
              env:
                  LITELLM_LOCAL_MODEL_COST_MAP: "True"
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

                  config.model: "gemini/gemini-3.8-flash"
                  config.fallback_models: '[]'
                  config.max_model_tokens: "1048576"
                  config.max_output_tokens: "65536"
                  config.reasoning_effort: "high"
                  config.additional_reasoning_effort_models: '["gemini/gemini-3.8-flash"]'
                  config.temperature: "1.0"
                  config.no_temperature_models: '["gemini/gemini-3.8-flash"]'

                  # Usa inferência Flex do Gemini
                  litellm.extra_body: '{"service_tier":"flex"}'

                  # Aguarda até 15 minutos no Flex, sem repetir chamadas expiradas.
                  config.ai_timeout: "900"
                  config.retry_same_model_on_timeout: "false"
                  # O backoff acima controla as tentativas, sem multiplicá-las no SDK.
                  config.num_retries: "0"

                  github_action_config.auto_review: "true"
                  github_action_config.auto_describe: "true"
                  github_action_config.auto_improve: "true"
                  github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
