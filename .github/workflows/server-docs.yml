name: Server docs

on:
  pull_request:
    paths:
      - "docs/server-docs/**"
      - ".github/workflows/server-docs.yml"
  push:
    paths:
      - "docs/server-docs/**"
      - ".github/workflows/server-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/server-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/server-docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build documentation
        run: npm run build
